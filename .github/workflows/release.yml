name: release
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      vars.RELEASE_ENABLED == 'true' &&
      (contains(github.event.pull_request.labels.*.name, 'major') ||
       contains(github.event.pull_request.labels.*.name, 'minor') ||
       contains(github.event.pull_request.labels.*.name, 'patch')) &&
      !contains(github.event.pull_request.labels.*.name, 'skip-release')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.next }}
      created: ${{ steps.mark.outputs.created }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve bump label with breaking-change escalation
        id: bump
        run: |
          set -euo pipefail
          label="$(jq -nr --argjson l "$PR_LABELS" 'first(["major","minor","patch"][] | select(IN($l[]))) // empty')"
          breaking=false
          if printf '%s' "$PR_LABELS" | jq -e 'index("breaking-change") != null' >/dev/null 2>&1 \
              || printf '%s' "$PR_TITLE" | grep -qE '^[a-z]+(\([^)]+\))?!:' \
              || printf '%s' "${PR_BODY:-}" | grep -qE '^BREAKING CHANGE:'; then
            breaking=true
            label="major"
          fi
          printf 'label=%s\n' "$label" >> "$GITHUB_OUTPUT"
          printf 'breaking=%s\n' "$breaking" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: ver
        # The pom is the source of truth for what gets released — it's in the
        # reviewed diff, unlike the tag list or the PR label. The label is
        # demoted to a pre-tag validation: it must agree with what the pom
        # already says, except on a re-run, where the tag from a prior attempt
        # already exists and the label is meaningless (the idempotency guard
        # below owns that branch).
        run: |
          set -euo pipefail
          next="v$(bash scripts/pom-version.sh .)"
          latest="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"

          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            : # tag already exists -> recovery path, label validation doesn't apply
          elif [ -z "$latest" ]; then
            : # first-ever release -> nothing to validate the label against
          else
            expected="$(bash scripts/bump-version.sh "$latest" "${{ steps.bump.outputs.label }}")"
            if [ "$next" != "$expected" ]; then
              echo "::error::pom.xml is $next but label '${{ steps.bump.outputs.label }}' off $latest implies $expected"
              exit 1
            fi
          fi

          printf 'latest=%s\n' "$latest" >> "$GITHUB_OUTPUT"
          printf 'next=%s\n'   "$next"   >> "$GITHUB_OUTPUT"

      - name: Idempotency guard
        id: guard
        # TODO(A3 — this is the design decision reserved for you, not auto-implemented):
        #
        # Before this PR, `next` auto-incremented past a failed release on every re-run
        # (bump(latest_tag, label) with latest now including the half-published tag), so
        # this `git rev-parse` almost never matched and the guard could never fire — that
        # was PR #5's deferred P0-2. Now that "Compute next version" derives `next` from
        # the pom, a re-run recomputes the *same* tag, so this check now correctly
        # succeeds on a recovery re-run. But `skip=true` still means "skip everything
        # below, including publish" — so a failed-publish re-run is still a silent no-op,
        # just one that's reachable now instead of unreachable. That's the bug this step
        # needs to actually fix. Two real designs, pick one:
        #
        #   1. Skip tag creation, still run publish. Makes "re-run all jobs" a working
        #      recovery path for a publish that failed after the tag/release already
        #      landed. Risk: attempts to publish coordinates that may already be live —
        #      Central rejects duplicates, so this fails loudly rather than corrupting
        #      anything. Requires splitting this step's single `skip` output into two:
        #      "tag was created" (gates the tag/release/mark steps below, :95-187) vs.
        #      "publish should run" (feeds the job's `created` output, :29, which the
        #      publish job's `if:` reads at :195).
        #
        #   2. Hard-fail when the tag exists. Unambiguous, forces a human to look before
        #      anything re-runs. Costs the automatic recovery path — but A5's planned
        #      `workflow_dispatch` input is a separate, explicit recovery route, so this
        #      isn't the only way out.
        #
        # The genuine-duplicate case (two PRs racing to the same version) no longer needs
        # defending here either way — A4's version-sync assertion catches that pre-merge
        # as a red required check.
        #
        # Current behavior below is UNCHANGED (still the old "skip everything" no-op) —
        # replace it with your chosen design.
        run: |
          if git rev-parse "${{ steps.ver.outputs.next }}" >/dev/null 2>&1; then
            echo "::notice::Tag ${{ steps.ver.outputs.next }} already exists — skipping release"
            printf 'skip=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'skip=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        if: steps.guard.outputs.skip == 'false'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bash scripts/build-release-notes.sh \
            "${{ steps.ver.outputs.next }}" \
            "${{ steps.bump.outputs.label }}" \
            "${{ steps.bump.outputs.breaking }}" \
            --from-existing \
            > /tmp/RELEASE_BODY.md

      - name: Guard against empty release notes
        id: notes_guard
        if: steps.guard.outputs.skip == 'false'
        run: |
          size="$(tr -d '[:space:]' < /tmp/RELEASE_BODY.md | wc -c | tr -d ' ')"
          if [ "$size" -lt 10 ]; then
            echo "::notice::CHANGELOG.md has no ## [${{ steps.ver.outputs.next }}] section — skipping tag + release"
            printf 'empty=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'empty=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG key
        id: gpg
        if: steps.guard.outputs.skip == 'false' && env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf 'default-cache-ttl 7200\n' >> ~/.gnupg/gpg-agent.conf
          printf 'allow-loopback-pinentry\n' >> ~/.gnupg/gpg-agent.conf
          printf 'pinentry-mode loopback\n'  >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent
          printf '%s' "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --sign -o /dev/null <(printf 'test')
          git config user.signingkey "$GPG_KEY_ID"
          git config tag.gpgsign true
          printf 'signed=true\n' >> "$GITHUB_OUTPUT"

      - name: Configure git committer
        if: steps.guard.outputs.skip == 'false'
        env:
          GPG_SIGNED: ${{ steps.gpg.outputs.signed }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "tylern91@users.noreply.github.com"
          git config commit.gpgsign "${GPG_SIGNED:-false}"

      - name: Create and push tag
        if: >
          steps.guard.outputs.skip == 'false' &&
          steps.notes_guard.outputs.empty == 'false' &&
          !contains(github.event.pull_request.body, '<!-- release-dry-run -->')
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.next }}"
          if [ "${{ steps.gpg.outputs.signed }}" = "true" ]; then
            git tag -s "$tag" -F /tmp/RELEASE_BODY.md
          else
            echo "::warning::GPG_PRIVATE_KEY secret not set — creating unsigned annotated tag"
            git tag -a "$tag" -F /tmp/RELEASE_BODY.md
          fi
          git push origin "$tag"

      - name: Create GitHub Release
        if: >
          steps.guard.outputs.skip == 'false' &&
          steps.notes_guard.outputs.empty == 'false' &&
          !contains(github.event.pull_request.body, '<!-- release-dry-run -->')
        run: |
          gh release create "${{ steps.ver.outputs.next }}" \
            --title "${{ steps.ver.outputs.next }}" \
            --notes-file /tmp/RELEASE_BODY.md \
            --latest \
            --verify-tag

      - name: Dry-run notice
        if: >
          steps.guard.outputs.skip == 'false' &&
          steps.notes_guard.outputs.empty == 'false' &&
          contains(github.event.pull_request.body, '<!-- release-dry-run -->')
        run: |
          echo "::notice::<!-- release-dry-run --> — would create tag ${{ steps.ver.outputs.next }} with the following notes:"
          cat /tmp/RELEASE_BODY.md

      - name: Mark release created
        id: mark
        if: >
          steps.guard.outputs.skip == 'false' &&
          steps.notes_guard.outputs.empty == 'false' &&
          !contains(github.event.pull_request.body, '<!-- release-dry-run -->')
        run: printf 'created=true\n' >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to Maven Central + upload release assets
    needs: release
    if: needs.release.outputs.created == 'true' && vars.CENTRAL_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: central
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is required to publish to Central — unsigned artifacts are rejected"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Assert pom.xml version matches release tag
        # Guards against the class of bug where the pom's version drifts from the
        # release tag — publishing would silently ship a mis-stamped artifact
        # (Maven analogue of the rqmd binary-version-mismatch incident).
        run: |
          set -euo pipefail
          want="${VERSION#v}"
          got="$(bash scripts/pom-version.sh .)"
          if [ "$got" != "$want" ]; then
            echo "::error::pom.xml reports version '$got' but release tag is '$want'"
            exit 1
          fi
          echo "pom.xml version '$got' matches release tag '$want'"

      - name: Build, sign, and verify
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B clean verify -Prelease -Dmaven.repo.local="$RUNNER_TEMP/m2" -Dgpg.passphrase="$GPG_PASSPHRASE"

      - name: Assert built jar manifest matches release tag
        run: |
          set -euo pipefail
          want="${VERSION#v}"
          got="$(unzip -p vietnamese-tokenizer-core/target/vietnamese-tokenizer-core-${want}.jar META-INF/MANIFEST.MF | grep '^Implementation-Version:' | tr -d '\r' | awk '{print $2}')"
          if [ "$got" != "$want" ]; then
            echo "::error::core jar Implementation-Version is '$got' but release tag is '$want'"
            exit 1
          fi
          echo "core jar Implementation-Version '$got' matches release tag '$want'"

      - name: Package release assets
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          for f in \
            "vietnamese-tokenizer-core/target/vietnamese-tokenizer-core-${version}.jar" \
            "vietnamese-tokenizer-core/target/vietnamese-tokenizer-core-${version}-sources.jar" \
            "vietnamese-tokenizer-dicts/target/vietnamese-tokenizer-dicts-${version}.jar"; do
            shasum -a 256 "$f" > "${f}.sha256"
          done

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          gh release upload "$VERSION" \
            "vietnamese-tokenizer-core/target/vietnamese-tokenizer-core-${version}.jar" \
            "vietnamese-tokenizer-core/target/vietnamese-tokenizer-core-${version}.jar.sha256" \
            "vietnamese-tokenizer-core/target/vietnamese-tokenizer-core-${version}-sources.jar" \
            "vietnamese-tokenizer-core/target/vietnamese-tokenizer-core-${version}-sources.jar.sha256" \
            "vietnamese-tokenizer-dicts/target/vietnamese-tokenizer-dicts-${version}.jar" \
            "vietnamese-tokenizer-dicts/target/vietnamese-tokenizer-dicts-${version}.jar.sha256" \
            --clobber

      - name: Deploy to Central
        # The irreversible step, run last: assets are already on the GitHub Release and the
        # manifest is already asserted, so a failure here doesn't lose anything recoverable.
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B deploy -Prelease -Dmaven.repo.local="$RUNNER_TEMP/m2" -Dgpg.passphrase="$GPG_PASSPHRASE"
