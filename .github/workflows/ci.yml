name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check pom.xml version matches CHANGELOG and bump label
        # Mirrors release.yml's own label resolution (breaking-change escalation
        # and skip-release included) so this pre-merge assertion validates against
        # the same effective label the release job will actually compute — otherwise
        # a breaking-change-escalated PR could pass here against its literal label
        # and still release a different version post-merge.
        #
        # The bump-label assertion (check-version-sync.sh's 2nd arg) only applies on
        # pull_request runs, where a PR label exists to validate the pom diff against.
        # On push (post-merge to main), there's no PR context and the version has
        # already shipped, so the 2nd arg is omitted entirely to skip that check.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            label="$(jq -nr --argjson l "$PR_LABELS" 'first(["major","minor","patch"][] | select(IN($l[]))) // empty')"
            if printf '%s' "$PR_LABELS" | jq -e 'index("breaking-change") != null' >/dev/null 2>&1 \
                || printf '%s' "$PR_TITLE" | grep -qE '^[a-z]+(\([^)]+\))?!:' \
                || printf '%s' "${PR_BODY:-}" | grep -qE '^BREAKING CHANGE:'; then
              label="major"
            fi
            if printf '%s' "$PR_LABELS" | jq -e 'index("skip-release") != null' >/dev/null 2>&1; then
              label=""
            fi
            bash scripts/check-version-sync.sh . "$label"
          else
            bash scripts/check-version-sync.sh .
          fi

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

  # Not a required status check yet — see CONTRIBUTING.md's sign-off section. Add it to the
  # branch ruleset only after it has passed once on a real PR.
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check every commit carries a matching Signed-off-by trailer
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          missing=0
          while IFS= read -r sha; do
            author_email="$(git log -1 --format='%ae' "$sha")"
            trailers="$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")"
            if [ -z "$trailers" ]; then
              echo "::error::Commit $sha has no Signed-off-by trailer (git commit -s)"
              missing=1
              continue
            fi
            if ! printf '%s\n' "$trailers" | grep -qF "$author_email"; then
              echo "::error::Commit $sha's Signed-off-by trailer doesn't match its author ($author_email)"
              missing=1
            fi
          done < <(git log --format='%H' "${base}..HEAD")
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All commits carry a matching Signed-off-by trailer"
